<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaross E91 - test</title>
<meta name="description" content="Förhandsvisning av subdivision-karossen till delkartan för BMW E91 325xi Touring.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='12' width='28' height='10' rx='3' fill='%23ff5a1f'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<style>
  :root { --bg: #ffffff; --fg: #18181b; --kant: #e4e4e7; --accent: #ff5a1f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0a0a; --fg: #fafafa; --kant: #27272a; } }
  :root[data-theme="dark"] { --bg: #0a0a0a; --fg: #fafafa; --kant: #27272a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #vy { position: fixed; inset: 0; }
  #vy canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: color-mix(in oklab, var(--bg) 85%, transparent); border: 1px solid var(--kant); border-radius: 10px; padding: 8px; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--kant); background: var(--bg); color: var(--fg); cursor: pointer; min-height: 36px; }
  button[aria-pressed="true"] { border-color: var(--accent); }
  label { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 200px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  output { white-space: nowrap; }
  #info { position: fixed; top: 8px; left: 8px; font-size: 12px; opacity: .75; }
  .val { display: flex; gap: 6px; align-items: center; flex: none; min-width: 0; }
  select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--kant); background: var(--bg); color: var(--fg); min-height: 36px; max-width: 100%; }
  #meddelande, #kredit { position: fixed; left: 8px; right: 8px; top: 30px; margin: 0 auto; max-width: 560px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--kant); background: color-mix(in oklab, var(--bg) 92%, transparent); font-size: 13px; }
  #meddelande { border-color: var(--accent); }
  #kredit { top: auto; bottom: calc(100% - 100dvh + 8px); font-size: 12px; position: static; margin: 0; border: 0; padding: 0; background: none; flex-basis: 100%; }
  #kredit[hidden], #meddelande[hidden] { display: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="vy" role="img" aria-label="3D-förhandsvisning av karossen"></div>
<div id="info">laddar ...</div>
<div id="meddelande" role="status" hidden></div>
<div class="panel">
  <button data-vy="profil">Profil</button>
  <button data-vy="snettfram">Snett fram</button>
  <button data-vy="snettbak">Snett bak</button>
  <button data-vy="fram">Fram</button>
  <button data-vy="bak">Bak</button>
  <button data-vy="ovan">Ovanifrån</button>
  <button id="tema">Tema</button>
  <button id="hjul">Hjul 650 mm</button>
  <span class="val"><label for="karossval" style="flex:none;min-width:0">Kaross:</label> <select id="karossval"></select></span>
  <button id="vand" hidden title="Vänd den inlästa modellen 180 grader om fronten hamnade bak">Vänd</button>
  <label for="op">Kaross <input type="range" id="op" min="0" max="100" value="100"> <output id="opv" for="op">100 %</output></label>
  <p id="kredit" hidden></p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { byggKaross, KAROSS_MATT } from './kaross.js';

const q = new URLSearchParams(location.search);
if (q.get('tema')) document.documentElement.dataset.theme = q.get('tema') === 'mork' ? 'dark' : 'light';
const mork = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

const behallare = document.getElementById('vy');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
behallare.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a5a5a, 2.0));
const sol = new THREE.DirectionalLight(0xffffff, 1.6); sol.position.set(3, 6, 2); scene.add(sol);
const motljus = new THREE.DirectionalLight(0xffffff, 0.6); motljus.position.set(-4, 3, -3); scene.add(motljus);
const grid = new THREE.GridHelper(8, 16, 0x888888, 0x888888); grid.material.transparent = true; grid.material.opacity = 0.22; scene.add(grid);

const t0 = performance.now();
const kaross = byggKaross(THREE);
const ms = Math.round(performance.now() - t0);
scene.add(kaross);

// Hjul: 235/45R17, nominell diameter 643 mm, uppmätt 650 mm, bredd 235 mm. Navet på KAROSS_MATT.navY
// (650/2 - 12 mm intryckning), alltså samma centrum som hjulhusens cirkel.
const B = 0.235;
const dackMat = new THREE.MeshStandardMaterial({ color: 0x232327, roughness: 0.9 });
const falgMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.35, metalness: 0.6 });
const hjul = new THREE.Group(); scene.add(hjul);
function byggHjul(D) {
  hjul.clear();
  const R = D / 2000;
  KAROSS_MATT.axlar.forEach((x, i) => {
    for (const s of [-1, 1]) {
      const z = s * KAROSS_MATT.sparvidd[i] / 2;
      const d = new THREE.Mesh(new THREE.CylinderGeometry(R, R, B, 64), dackMat); d.rotation.x = Math.PI / 2; d.position.set(x, KAROSS_MATT.navY, z); hjul.add(d);
      const f = new THREE.Mesh(new THREE.CylinderGeometry(0.216, 0.216, 0.01, 48), falgMat); f.rotation.x = Math.PI / 2; f.position.set(x, KAROSS_MATT.navY, z + s * (B / 2 + 0.004)); hjul.add(f);
    }
  });
  const luft = KAROSS_MATT.hjulhus.map((h) => Math.round((h.topp - KAROSS_MATT.navY - R) * 1000));
  const knapp = document.getElementById('hjul');
  knapp.textContent = `Hjul ${D} mm`;
  knapp.title = `Luft överst: fram ${luft[0]} mm, bak ${luft[1]} mm (utan intryckning av däcket)`;
  console.log('hjul', D, 'mm, luft fram/bak', luft.join(' / '), 'mm');
}
let hjulD = +(q.get('hjul') || 650);
byggHjul(hjulD);
document.getElementById('hjul').addEventListener('click', () => { hjulD = hjulD === 650 ? 643 : 650; byggHjul(hjulD); });

document.getElementById('info').textContent = `${kaross.userData.trianglar} trianglar (lack ${kaross.userData.lackTrianglar}), byggd på ${ms} ms`;
console.log('kaross', kaross.userData.trianglar, 'trianglar', ms, 'ms');

// ============================================================
// Alternativa karosser: färdiga modeller (glTF Binary) som läggs för hand i modeller/.
// Filerna laddas först när de väljs, så att sidan inte gör några misslyckade anrop i onödan.
// del: vilken del av modellen som används, andring: vad som ändrats (krävs för CC BY-krediten).
// nod: namnet på den nod (bil) som ska användas när filen innehåller flera bilar. Lämna tomt
// tills filen finns; nodnamnen på toppnivå loggas när filen laddas. ?nod=<namn> provar ett namn
// utan att ändra här.
// ============================================================
const CC_BY = 'https://creativecommons.org/licenses/by/4.0/';
const ALT_KAROSSER = [
  { id: 'comrade-wagon', namn: 'Generisk kombi', modell: 'Generic passenger car pack', del: ' (kombin)', fil: 'modeller/comrade-wagon.glb',
    upphovsperson: 'Comrade1280', licens: 'CC BY 4.0', licensLank: CC_BY, nod: '', andring: 'bara kombin utplockad och skalad',
    lank: 'https://sketchfab.com/3d-models/generic-passenger-car-pack-20f9af9b8a404d5cb022ac6fe87f21f5' },
  { id: 'han66st-wagon', namn: 'Lowpoly-kombi', modell: 'Lowpoly Sedan & Wagon', fil: 'modeller/han66st-wagon.glb',
    upphovsperson: 'Han66st', licens: 'CC BY 4.0', licensLank: CC_BY, nod: '',
    lank: 'https://sketchfab.com/3d-models/lowpoly-sedan-wagon-e11a46478c674b279fe9d299b2125c30' },
  { id: 'passat-anserkon', namn: 'Passat-kombi', modell: 'Generic USA/EU Station wagon', fil: 'modeller/passat-anserkon.glb',
    upphovsperson: 'Anserkon', licens: 'CC BY 4.0', licensLank: CC_BY, nod: '',
    lank: 'https://sketchfab.com/3d-models/generic-usaeu-station-wagon-c14f271c9d414b8e8d25e7cec3bb44f5' },
];
const LANGD = KAROSS_MATT.framX - KAROSS_MATT.bakX; // 4,52
const HJULBAS = KAROSS_MATT.axlar[0] - KAROSS_MATT.axlar[1]; // 2,76
const ARHJUL = /wheel|tire|tyre|rim|hjul|d[aä]ck|f[aä]lg|reifen|felge/i;
const ARGLAS = /glass|glas|window|windshield|windscreen|optics|lamp|light|lykt|head|tail|indicator|blinker|lens/i;

const valEl = document.getElementById('karossval'), meddelandeEl = document.getElementById('meddelande');
const kreditEl = document.getElementById('kredit'), vandEl = document.getElementById('vand');
valEl.append(new Option('Egen E91', 'egen'));
for (const a of ALT_KAROSSER) valEl.append(new Option(`${a.namn} (CC BY, ${a.upphovsperson})`, a.id));
const altGrupp = new THREE.Group(); altGrupp.name = 'alt-kaross'; scene.add(altGrupp);
const altCache = new Map(); // id -> { grupp, material: [{ m, bas, glas }] }
let altValt = null, laddar = 0;

function altOpacitet(v) {
  if (!altValt) return;
  for (const { m, bas, glas } of altValt.material) {
    if (glas) { m.transparent = true; m.depthWrite = false; m.opacity = Math.min(bas, 0.15 + 0.6 * v); }
    else { const fast = v >= 0.999; m.transparent = !fast; m.depthWrite = fast; m.opacity = bas * v; }
    m.needsUpdate = true;
  }
  altGrupp.visible = v > 0.001;
}

function visaMeddelande(nod) { meddelandeEl.replaceChildren(...[].concat(nod || [])); meddelandeEl.hidden = !nod; }
function visaKredit(a) {
  kreditEl.hidden = !a;
  if (!a) return;
  const l = (href, text) => Object.assign(document.createElement('a'), { href, text, target: '_blank', rel: 'noopener' });
  kreditEl.replaceChildren(`"${a.modell}"${a.del || ''} av ${a.upphovsperson}, `, l(a.licensLank, a.licens), ', ', l(a.lank, a.lank), `, modifierad: ${a.andring || 'skalad'}.`);
}

// Normalisering: längden längs x, framaxeln åt +x, hjulen över axlarna, står på marken
function normalisera(a, rot) {
  const namn = (o) => o.name || '(namnlös)';
  // Toppnivån: gå igenom omslagsnoder med ett enda barn (Sketchfab_model, root, ...)
  let topp = rot; const kedja = [];
  while (topp.children.length === 1 && !topp.children[0].isMesh) { topp = topp.children[0]; kedja.push(namn(topp)); }
  console.log(`[alt-kaross] ${a.id}: noder på toppnivå (under ${kedja.join(' / ') || 'scenen'}):`, topp.children.map(namn));
  const nodNamn = q.get('nod') || a.nod;
  let modell = rot;
  if (nodNamn) {
    let hit = rot.getObjectByName(nodNamn);
    if (!hit) rot.traverse((o) => { if (!hit && o.name && o.name.toLowerCase().includes(nodNamn.toLowerCase())) hit = o; });
    if (hit) { modell = hit; console.log(`[alt-kaross] använder noden "${namn(hit)}"`); }
    else console.warn(`[alt-kaross] noden "${nodNamn}" finns inte, använder hela filen`);
  } else if (topp.children.filter((o) => !ARHJUL.test(o.name)).length > 1) {
    console.log('[alt-kaross] flera noder på toppnivå. Sätt fältet nod i ALT_KAROSSER (eller ?nod=) om filen innehåller flera bilar.');
  }
  rot.updateMatrixWorld(true);
  // Bygg om till en platt grupp med geometrin i världskoordinater (enklare att normalisera)
  const ut = new THREE.Group(), material = [], hjulMesher = [];
  modell.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    const mats = (Array.isArray(o.material) ? o.material : [o.material]).map((m0) => {
      const m = m0.clone(); m.side = THREE.DoubleSide;
      const glas = ARGLAS.test(`${o.name} ${m0.name}`) || (m0.transparent && m0.opacity < 0.99) || m0.transmission > 0;
      material.push({ m, bas: m0.transparent ? m0.opacity : 1, glas });
      return m;
    });
    const mesh = new THREE.Mesh(g, Array.isArray(o.material) ? mats : mats[0]);
    mesh.name = o.name;
    ut.add(mesh);
    if (ARHJUL.test(`${o.name} ${o.parent && o.parent.name}`)) hjulMesher.push(mesh);
  });
  // Längden ska ligga längs x: huvudriktningen i planvy (PCA) ur hjulens centrum, annars ur alla punkter.
  // Bilar i paket står ofta snett och utanför origo.
  const plan = [];
  if (hjulMesher.length >= 4) for (const m of hjulMesher) { const c = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()); plan.push([c.x, c.z]); }
  else {
    // utan hjulnamn: de lägsta 12 % av höjden (däcken), annars alla punkter
    const b0 = new THREE.Box3().setFromObject(ut), grans = b0.min.y + 0.12 * (b0.max.y - b0.min.y);
    for (const lag of [true, false]) {
      for (const m of ut.children) { const p = m.geometry.attributes.position; for (let i = 0; i < p.count; i++) if (!lag || p.getY(i) < grans) plan.push([p.getX(i), p.getZ(i)]); }
      if (plan.length >= 8) break;
    }
  }
  const mx = plan.reduce((t, p) => t + p[0], 0) / plan.length, mz = plan.reduce((t, p) => t + p[1], 0) / plan.length;
  let cxx = 0, czz = 0, cxz = 0;
  for (const [x, z] of plan) { cxx += (x - mx) ** 2; czz += (z - mz) ** 2; cxz += (x - mx) * (z - mz); }
  const vinkel = 0.5 * Math.atan2(2 * cxz, cxx - czz);
  for (const m of ut.children) { m.geometry.translate(-mx, 0, -mz); m.geometry.rotateY(vinkel); }
  let box = new THREE.Box3().setFromObject(ut), size = box.getSize(new THREE.Vector3());
  // Fronten: antas vara änden med kortast överhäng (som på E91:an); knappen Vänd rättar om det blev fel
  // Hjulens centrum i längsled: ur namngivna mesher, annars ur geometrin (de lägsta 12 % av höjden är nästan bara däck)
  const mitt = (box.min.x + box.max.x) / 2;
  let fram = [], bak = [], kalla;
  if (hjulMesher.length) {
    kalla = `${hjulMesher.length} mesher med hjulnamn (${[...new Set(hjulMesher.map((m) => m.name))].slice(0, 8).join(', ')})`;
    for (const m of hjulMesher) { const c = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()); (c.x > mitt ? fram : bak).push(c.x); }
  }
  if (!fram.length || !bak.length) {
    fram = []; bak = [];
    const grans = box.min.y + 0.12 * size.y, v = new THREE.Vector3();
    for (const m of ut.children) {
      const p = m.geometry.attributes.position;
      for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); if (v.y < grans) (v.x > mitt ? fram : bak).push(v.x); }
    }
    kalla = `geometrin (${fram.length + bak.length} punkter i de lägsta 12 % av höjden)`;
  }
  const medel = (l) => l.reduce((s, x) => s + x, 0) / l.length;
  if (!fram.length || !bak.length) { fram = [box.max.x - 0.167 * size.x]; bak = [box.min.x + 0.222 * size.x]; kalla = 'inga hjul hittade, E91:ans överhäng antas'; }
  let xf = medel(fram), xb = medel(bak);
  if (box.max.x - xf > xb - box.min.x) {
    for (const m of ut.children) m.geometry.rotateY(Math.PI);
    [xf, xb] = [-xb, -xf]; box = new THREE.Box3().setFromObject(ut);
  }
  console.log(`[alt-kaross] ${a.id}: vriden ${(vinkel * 180 / Math.PI).toFixed(1)} grader så att längden ligger längs x (ur ${plan.length} punkter)`);
  // Uniform skala till E91:ans längd, sedan extra skala längs x så att hjulbasen blir exakt 2,76
  const s = LANGD / size.x, kx = HJULBAS / ((xf - xb) * s);
  const axelMitt = (xf + xb) / 2, zMitt = (box.min.z + box.max.z) / 2;
  for (const m of ut.children) {
    m.geometry.translate(-axelMitt, -box.min.y, -zMitt);
    m.geometry.scale(s * kx, s, s);
    m.geometry.computeBoundingBox(); m.geometry.computeBoundingSphere();
  }
  box = new THREE.Box3().setFromObject(ut); size = box.getSize(new THREE.Vector3());
  console.log(`[alt-kaross] ${a.id}: hjulen ur ${kalla}. Hjulbas i filen ${((xf - xb)).toFixed(3)} (enheter), skala ${s.toFixed(4)}, extra längs x ${kx.toFixed(3)}. ` +
    `Resultat: längd ${size.x.toFixed(3)} m, bredd ${size.z.toFixed(3)} m, höjd ${size.y.toFixed(3)} m, axlar x = +-${(HJULBAS / 2).toFixed(2)}.`);
  return { grupp: ut, material, kx };
}

async function valjKaross(id) {
  const a = ALT_KAROSSER.find((k) => k.id === id) || null;
  const nr = ++laddar;
  altGrupp.clear(); altValt = null;
  kaross.visible = !a; if (!a) kaross.userData.opacitet(+op.value / 100);
  visaKredit(a); visaMeddelande(null); vandEl.hidden = true;
  if (!a) return;
  let res = altCache.get(id);
  if (!res) {
    visaMeddelande(`Laddar ${a.fil} ...`);
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    try {
      const gltf = await new GLTFLoader().loadAsync(a.fil);
      res = normalisera(a, gltf.scene);
      altCache.set(id, res);
    } catch (err) {
      if (nr !== laddar) return;
      const lank = Object.assign(document.createElement('a'), { href: a.lank, text: 'Sketchfab', target: '_blank', rel: 'noopener' });
      visaMeddelande([`Lägg filen ${a.fil}. Ladda ner från `, lank, ' (glTF Binary).']);
      console.log(`[alt-kaross] ${a.fil} saknas eller gick inte att läsa:`, err && err.message ? err.message : err);
      return;
    }
  }
  if (nr !== laddar) return;
  visaMeddelande(null);
  altValt = res; altGrupp.add(res.grupp); vandEl.hidden = false;
  altOpacitet(+op.value / 100);
}
valEl.addEventListener('change', () => valjKaross(valEl.value));
vandEl.addEventListener('click', () => { altGrupp.rotation.y = altGrupp.rotation.y ? 0 : Math.PI; });
if (q.get('kaross')) queueMicrotask(() => { valEl.value = q.get('kaross'); valjKaross(valEl.value); });

const op = document.getElementById('op'), opv = document.getElementById('opv');
const satOp = (v) => { op.value = v; opv.textContent = `${v} %`; if (!altValt && valEl.value === 'egen') kaross.userData.opacitet(v / 100); altOpacitet(v / 100); };
op.addEventListener('input', () => satOp(+op.value));
satOp(+(q.get('op') || 100));
const tema = () => kaross.userData.tema(mork());
tema();
document.getElementById('tema').addEventListener('click', () => { document.documentElement.dataset.theme = mork() ? 'light' : 'dark'; tema(); });

const MITT = new THREE.Vector3(...(q.get('mal') || '0,0.62,0').split(',').map(Number));
const VYER = { profil: [0, 0.08, -1], snettfram: [0.8, 0.35, -0.6], snettbak: [-0.75, 0.62, -0.62], fram: [1, 0.1, 0], bak: [-1, 0.12, 0], ovan: [-0.0001, 1, 0] };
function visa(namn) {
  const r = new THREE.Vector3(...VYER[namn]).normalize();
  const radie = 2.45, fov = THREE.MathUtils.degToRad(camera.fov / 2);
  const avst = radie / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camera.aspect))) * 0.92 / +(q.get('zoom') || 1);
  camera.position.copy(MITT).addScaledVector(r, avst);
  controls.target.copy(MITT);
  controls.update();
  document.querySelectorAll('[data-vy]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vy === namn)));
}
document.querySelectorAll('[data-vy]').forEach((b) => b.addEventListener('click', () => visa(b.dataset.vy)));
function storlek() {
  const w = behallare.clientWidth, h = behallare.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
storlek();
addEventListener('resize', storlek);
visa(q.get('vy') || 'snettbak');
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
document.body.dataset.klar = '1';
</script>
</body>
</html>
