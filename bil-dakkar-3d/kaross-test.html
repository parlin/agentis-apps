<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaross E91 - test</title>
<meta name="description" content="Förhandsvisning av subdivision-karossen till delkartan för BMW E91 325xi Touring.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='12' width='28' height='10' rx='3' fill='%23ff5a1f'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<style>
  :root { --bg: #ffffff; --fg: #18181b; --kant: #e4e4e7; --accent: #ff5a1f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0a0a; --fg: #fafafa; --kant: #27272a; } }
  :root[data-theme="dark"] { --bg: #0a0a0a; --fg: #fafafa; --kant: #27272a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #vy { position: fixed; inset: 0; }
  #vy canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: color-mix(in oklab, var(--bg) 85%, transparent); border: 1px solid var(--kant); border-radius: 10px; padding: 8px; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--kant); background: var(--bg); color: var(--fg); cursor: pointer; min-height: 36px; }
  button[aria-pressed="true"] { border-color: var(--accent); }
  label { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 200px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  output { white-space: nowrap; }
  #info { position: fixed; top: 8px; left: 8px; font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<div id="vy" role="img" aria-label="3D-förhandsvisning av karossen"></div>
<div id="info">laddar ...</div>
<div class="panel">
  <button data-vy="profil">Profil</button>
  <button data-vy="snettfram">Snett fram</button>
  <button data-vy="snettbak">Snett bak</button>
  <button data-vy="fram">Fram</button>
  <button data-vy="bak">Bak</button>
  <button data-vy="ovan">Ovanifrån</button>
  <button id="tema">Tema</button>
  <label for="op">Kaross <input type="range" id="op" min="0" max="100" value="100"> <output id="opv" for="op">100 %</output></label>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { byggKaross, KAROSS_MATT } from './kaross.js';

const q = new URLSearchParams(location.search);
if (q.get('tema')) document.documentElement.dataset.theme = q.get('tema') === 'mork' ? 'dark' : 'light';
const mork = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

const behallare = document.getElementById('vy');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
behallare.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a5a5a, 2.0));
const sol = new THREE.DirectionalLight(0xffffff, 1.6); sol.position.set(3, 6, 2); scene.add(sol);
const motljus = new THREE.DirectionalLight(0xffffff, 0.6); motljus.position.set(-4, 3, -3); scene.add(motljus);
const grid = new THREE.GridHelper(8, 16, 0x888888, 0x888888); grid.material.transparent = true; grid.material.opacity = 0.22; scene.add(grid);

const t0 = performance.now();
const kaross = byggKaross(THREE);
const ms = Math.round(performance.now() - t0);
scene.add(kaross);

// Hjul: 235/45R17, diameter 643 mm, bredd 235 mm
const R = 0.3217, B = 0.235;
const dackMat = new THREE.MeshStandardMaterial({ color: 0x232327, roughness: 0.9 });
const falgMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.35, metalness: 0.6 });
KAROSS_MATT.axlar.forEach((x, i) => {
  for (const s of [-1, 1]) {
    const z = s * KAROSS_MATT.sparvidd[i] / 2;
    const d = new THREE.Mesh(new THREE.CylinderGeometry(R, R, B, 40), dackMat); d.rotation.x = Math.PI / 2; d.position.set(x, R, z); scene.add(d);
    const f = new THREE.Mesh(new THREE.CylinderGeometry(0.216, 0.216, 0.01, 32), falgMat); f.rotation.x = Math.PI / 2; f.position.set(x, R, z + s * (B / 2 + 0.004)); scene.add(f);
  }
});

document.getElementById('info').textContent = `${kaross.userData.trianglar} trianglar (lack ${kaross.userData.lackTrianglar}), byggd på ${ms} ms`;
console.log('kaross', kaross.userData.trianglar, 'trianglar', ms, 'ms');

const op = document.getElementById('op'), opv = document.getElementById('opv');
const satOp = (v) => { op.value = v; opv.textContent = `${v} %`; kaross.userData.opacitet(v / 100); };
op.addEventListener('input', () => satOp(+op.value));
satOp(+(q.get('op') || 100));
const tema = () => kaross.userData.tema(mork());
tema();
document.getElementById('tema').addEventListener('click', () => { document.documentElement.dataset.theme = mork() ? 'light' : 'dark'; tema(); });

const MITT = new THREE.Vector3(...(q.get('mal') || '0,0.62,0').split(',').map(Number));
const VYER = { profil: [0, 0.08, -1], snettfram: [0.8, 0.35, -0.6], snettbak: [-0.75, 0.62, -0.62], fram: [1, 0.1, 0], bak: [-1, 0.12, 0], ovan: [-0.0001, 1, 0] };
function visa(namn) {
  const r = new THREE.Vector3(...VYER[namn]).normalize();
  const radie = 2.45, fov = THREE.MathUtils.degToRad(camera.fov / 2);
  const avst = radie / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camera.aspect))) * 0.92 / +(q.get('zoom') || 1);
  camera.position.copy(MITT).addScaledVector(r, avst);
  controls.target.copy(MITT);
  controls.update();
  document.querySelectorAll('[data-vy]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vy === namn)));
}
document.querySelectorAll('[data-vy]').forEach((b) => b.addEventListener('click', () => visa(b.dataset.vy)));
function storlek() {
  const w = behallare.clientWidth, h = behallare.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
storlek();
addEventListener('resize', storlek);
visa(q.get('vy') || 'snettbak');
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
document.body.dataset.klar = '1';
</script>
</body>
</html>
